<!doctype html>
<html lang="en" class="no-transitions">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Curated design resources, tools, and inspiration for designers and developers." />
    <!-- The app is served at opensession.co/directory (proxied to this deployment). The build writes each
         route's canonical link and og:url into its own HTML file (src/lib/prerender.ts), and the app keeps
         them current as you navigate (src/lib/canonical.ts), so neither is written here. -->

    <!-- Open Graph / Social Preview -->
    <!-- FORK NOTE: Point the image URLs below at your own deployment, set SITE_ORIGIN in src/lib/canonical.ts
         to your domain, and set BASE in vite.config.ts to your path ('/' for the root of a domain). -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="OS Design Directory" />
    <meta property="og:description" content="Curated design resources, tools, and inspiration for designers and developers." />
    <meta property="og:image" content="https://opensession.co/directory/og-image.jpg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="OS Design Directory" />
    <meta name="twitter:description" content="Curated design resources, tools, and inspiration for designers and developers." />
    <meta name="twitter:image" content="https://opensession.co/directory/og-image.jpg" />

    <title>OS Design Directory</title>
    <!-- Apply dark theme immediately to prevent flash -->
    <script>
      document.documentElement.classList.add('dark');
      // Hides the build-time HTML in #root (src/lib/prerender.ts) until React replaces it
      document.documentElement.dataset.js = '';
    </script>
    <style>
      [data-js] [data-prerendered] { display: none; }
      [data-prerendered] { max-width: 48rem; margin: 0 auto; padding: 2rem 1rem; line-height: 1.6; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
